name: Refrescar certificación tablas normativas

on:
  push:
    branches: [main]
    paths:
      - "data/seguimiento_normativo.js"
      - "config/tablas_normativas_vigencia/**"
      - "config/tablas_normativas_vigencia_policy.json"
      - "automation/tablas_normativas/vigencia_gate.py"
      - "scripts/exportar_vigencia_tablas.py"
      - ".github/workflows/refrescar-certificacion-tablas.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refrescar-certificacion-tablas
  cancel-in-progress: true

jobs:
  exportar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Exportar estado fail-closed
        run: python scripts/exportar_vigencia_tablas.py

      - name: Guardar estado para GitHub Pages
        run: |
          if git diff --quiet -- data/vigencia_tablas_normativas.js; then
            echo "Sin cambios de certificación."
            exit 0
          fi
          git config user.name "Observatorio IPT Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/vigencia_tablas_normativas.js
          git commit -m "Refrescar certificación tablas normativas"
          git pull --rebase origin main
          git push origin main
