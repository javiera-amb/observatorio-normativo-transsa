name: Validar módulo Diario Oficial local

# El análisis con Ollama se ejecuta en el computador local de Transsa.
# Este workflow queda disponible para validar el repositorio sin usar APIs pagadas.
on:
  workflow_dispatch:
  push:
    paths:
      - "automation/actualizar_desde_diario.py"
      - "automation/sources/**"
      - "automation/reports/**"
      - "automation/ollama/**"
      - "core/**"
      - "tests/**"
      - ".github/workflows/actualizar-diario.yml"

permissions:
  contents: read

jobs:
  validar:
    name: Validar código y portal
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: automation/requirements.txt

      - name: Instalar dependencias
        run: pip install -r automation/requirements.txt

      - name: Ejecutar pruebas automáticas
        run: python -m unittest discover -s tests -v

      - name: Validar portal
        run: python automation/validar_sitio.py

      - name: Confirmar modalidad local
        run: |
          echo "Validación correcta."
          echo "La descarga y el análisis del Diario Oficial se ejecutan localmente con ejecutar_diario_local.bat."
