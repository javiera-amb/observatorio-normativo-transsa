name: Actualizar Diario Oficial

on:
  schedule:
    - cron: "30 8 * * *"
      timezone: "America/Santiago"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-diario-oficial
  cancel-in-progress: false

jobs:
  actualizar:
    name: Revisar y publicar
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: automation/requirements.txt

      - name: Instalar dependencias
        run: pip install -r automation/requirements.txt

      - name: Revisar Diario Oficial y actualizar portal
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5-mini' }}
        run: python automation/actualizar_desde_diario.py

      - name: Validar archivos
        run: python automation/validar_sitio.py

      - name: Guardar cambios
        run: |
          if git diff --quiet; then
            echo "No hay cambios nuevos."
            exit 0
          fi

          git config user.name "Observatorio Normativo Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/reportes.js documentos/
          git commit -m "Actualización normativa $(date +'%Y-%m-%d')"
          git push
