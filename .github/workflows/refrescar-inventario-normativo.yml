name: Sincronizar vigencia normativa nacional

on:
  schedule:
    # Después de la sincronización diaria del Portal IPT (12:45 UTC).
    - cron: "20 13 * * *"
  push:
    branches: [main]
    paths:
      - "data/actos_ipt_nacional_*.js"
      - "data/actos_ipt_sync.json"
      - "data/ipt_reportes.js"
      - "data/tablas_normativas_sharepoint.js"
      - "config/vigencia_actos_verificados.json"
      - "config/tablas_normativas_cobertura.json"
      - "config/tablas_normativas_vigencia/*.json"
      - "config/tablas_normativas_vigencia_evidencia/*.json"
      - "config/tablas_normativas_vigencia_policy.json"
      - "automation/tablas_normativas/vigencia_gate.py"
      - "automation/tablas_normativas/certification.py"
      - "scripts/refrescar_seguimiento_publico.py"
      - "scripts/refrescar_seguimiento_publico_v2.py"
      - "scripts/exportar_vigencia_tablas.py"
      - "scripts/exportar_cola_tablas_normativas.py"
      - "tests/test_vigencia_nacional.py"
      - ".github/workflows/refrescar-inventario-normativo.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sincronizar-vigencia-normativa-nacional
  cancel-in-progress: true

jobs:
  refrescar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: automation/requirements.txt

      - run: pip install -r automation/requirements.txt

      - name: Probar gate y certificación fail-closed
        run: python -m unittest discover -s tests -p 'test_vigencia_nacional.py' -v

      - name: Generar seguimiento detallado de las 346 comunas
        run: python scripts/refrescar_seguimiento_publico_v2.py

      - name: Exportar certificación fail-closed
        run: python scripts/exportar_vigencia_tablas.py

      - name: Generar cola nacional de saneamiento
        run: python scripts/exportar_cola_tablas_normativas.py

      - name: Validar integridad nacional antes de publicar
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def assignment(path, prefix):
              raw = Path(path).read_text(encoding='utf-8').strip()
              if not raw.startswith(prefix) or not raw.endswith(';'):
                  raise SystemExit(f'Formato inválido: {path}')
              return json.loads(raw[len(prefix):-1])

          tracking = assignment(
              'data/seguimiento_normativo.js',
              'window.SEGUIMIENTO_NORMATIVO = '
          )
          vigencia = assignment(
              'data/vigencia_tablas_normativas.js',
              'window.VIGENCIA_TABLAS_NORMATIVAS = '
          )
          cola = assignment(
              'data/cola_tablas_normativas.js',
              'window.COLA_TABLAS_NORMATIVAS = '
          )

          comunas = tracking.get('comunas') or []
          vigencia_rows = vigencia.get('comunas') or []
          cola_rows = cola.get('comunas') or []
          if len(comunas) != 346:
              raise SystemExit(f'Seguimiento incompleto: {len(comunas)}/346 comunas.')
          if int(vigencia.get('total_comunas') or 0) != 346 or len(vigencia_rows) != 346:
              raise SystemExit('La salida de vigencia no contiene exactamente las 346 comunas.')
          if int(cola.get('total_comunas') or 0) != 346 or len(cola_rows) != 346:
              raise SystemExit('La cola operativa no contiene exactamente las 346 comunas.')
          if int(cola.get('cobertura_plataforma') or 0) != 346:
              raise SystemExit('La cobertura operativa de plataforma debe ser 346/346.')
          if cola.get('alcance_completitud') != 'PRC_Y_NORMATIVA_COMUNAL':
              raise SystemExit('El alcance de completitud debe ser PRC + normativa comunal.')
          excluded = set(cola.get('instrumentos_excluidos_completitud') or [])
          if not {'PRI', 'PRM'}.issubset(excluded):
              raise SystemExit('PRI y PRM deben quedar fuera del indicador de completitud.')

          seen = set()
          for row in comunas:
              comuna = str(row.get('comuna') or '').strip()
              region = str(row.get('region') or '').strip()
              key = (region.casefold(), comuna.casefold())
              if not comuna or not region:
                  raise SystemExit('Hay una fila nacional sin región o comuna.')
              if key in seen:
                  raise SystemExit(f'Comuna duplicada en seguimiento: {region} / {comuna}')
              seen.add(key)

              expected = int(row.get('actos_posteriores') or 0)
              detail = row.get('actos_posteriores_detalle') or []
              ids = [str(item.get('official_id') or item.get('id') or '').strip() for item in detail]
              ids = [value for value in ids if value]
              if expected != len(ids) or len(ids) != len(set(ids)):
                  raise SystemExit(
                      f'Inventario inconsistente en {comuna}: contador={expected}, ids={len(ids)}.'
                  )

          tracking_names = {str(row.get('comuna') or '').strip().casefold() for row in comunas}
          vigencia_names = {str(row.get('comuna') or '').strip().casefold() for row in vigencia_rows}
          cola_names = {str(row.get('comuna') or '').strip().casefold() for row in cola_rows}
          if tracking_names != vigencia_names or tracking_names != cola_names:
              raise SystemExit('Seguimiento, vigencia y cola nacional no contienen el mismo universo comunal.')

          certified = 0
          for row in vigencia_rows:
              blockers = row.get('bloqueantes_vigencia') or []
              if row.get('vigencia_certificada'):
                  certified += 1
                  if blockers:
                      raise SystemExit(
                          f"Certificación inválida con bloqueantes: {row.get('comuna')}"
                      )
                  if row.get('estado_vigencia') != 'VIGENTE_SINCRONIZADA':
                      raise SystemExit(
                          f"Certificación con estado incoherente: {row.get('comuna')}"
                      )
                  if not row.get('version_normativa_id'):
                      raise SystemExit(
                          f"Certificación sin versión normativa: {row.get('comuna')}"
                      )
              elif row.get('estado_vigencia') == 'VIGENTE_SINCRONIZADA':
                  raise SystemExit(
                      f"Comuna marcada sincronizada sin certificación: {row.get('comuna')}"
                  )

          if int(vigencia.get('certificadas') or 0) != certified:
              raise SystemExit('El contador global de certificadas no coincide con el detalle.')
          if int(vigencia.get('bloqueadas') or 0) != 346 - certified:
              raise SystemExit('El contador global de bloqueadas no coincide con el detalle.')
          if int(cola.get('certificadas') or 0) != certified:
              raise SystemExit('La cola y el gate no coinciden en cantidad de comunas certificadas.')

          for row in cola_rows:
              action = str(row.get('accion_prioritaria') or '').strip()
              if not action:
                  raise SystemExit(f"Comuna sin acción operativa: {row.get('comuna')}")
              if row.get('vigencia_certificada') and action != 'CERTIFICADA':
                  raise SystemExit(f"Comuna certificada con acción incoherente: {row.get('comuna')}")
              if not row.get('vigencia_certificada') and action == 'CERTIFICADA':
                  raise SystemExit(f"Comuna bloqueada marcada CERTIFICADA: {row.get('comuna')}")

          print(f'QA nacional OK: 346 comunas · {certified} certificadas actualmente.')
          print('Acciones operativas:', json.dumps(cola.get('acciones') or {}, ensure_ascii=False))
          PY

      - name: Guardar salidas nacionales
        run: |
          CHANGES="$(git status --porcelain -- data/seguimiento_normativo.js data/vigencia_tablas_normativas.js data/cola_tablas_normativas.js)"
          if [ -z "$CHANGES" ]; then
            echo "Sin cambios de inventario/certificación/cola."
            exit 0
          fi
          echo "$CHANGES"
          git config user.name "Observatorio IPT Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/seguimiento_normativo.js data/vigencia_tablas_normativas.js data/cola_tablas_normativas.js
          git commit -m "data: sincronizar vigencia normativa nacional"
          git pull --rebase origin main
          git push origin main
