name: Validar TUI

# La recolección diaria del Diario Oficial y Ollama se ejecutan localmente.
# Este workflow valida código, configuración, pruebas y compatibilidad del portal.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "*.html"
      - "*.js"
      - "*.css"
      - "data/**"
      - "automation/**"
      - "config/**"
      - "core/**"
      - "scripts/**"
      - "tests/**"
      - "docs/**"
      - ".github/workflows/validar-tui.yml"
  push:
    branches:
      - main
    paths:
      - "*.html"
      - "*.js"
      - "*.css"
      - "data/**"
      - "automation/**"
      - "config/**"
      - "core/**"
      - "scripts/**"
      - "tests/**"
      - "docs/**"
      - ".github/workflows/validar-tui.yml"

concurrency:
  group: validar-tui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validar:
    name: Validar código, fuentes y portal
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: automation/requirements.txt

      - name: Instalar dependencias
        run: pip install -r automation/requirements.txt

      - name: Validar registro de fuentes de noticias
        run: python scripts/validate_news_sources.py

      - name: Ejecutar pruebas automáticas
        run: python -m unittest discover -s tests -v

      - name: Validar JavaScript del portal
        run: |
          node --check app.js
          node --check ux-refresh.js
          node --check tui-content.js
          node --check tablas-normativas-ipt.js
          node --check tablas-normativas-ipt-v2.js
          node --check tablas-normativas-fuentes.js
          node --check data/tablas_normativas_sharepoint.js

      - name: Validar portal
        run: python automation/validar_sitio.py

      - name: Confirmar modalidad local
        run: |
          echo "Validación correcta."
          echo "La recolección real del Diario Oficial, Ollama y la publicación diaria se ejecutan localmente."
