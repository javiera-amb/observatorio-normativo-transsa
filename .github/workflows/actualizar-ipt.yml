name: Actualizar IPT y vigencia diaria

on:
  schedule:
    - cron: "0 7 * * *"
      timezone: "America/Santiago"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/actualizar-ipt.yml"
      - "scripts/barrido_ipt_diario_oficial.py"
      - "scripts/sincronizar_portal_ipt.py"
      - "scripts/sincronizar_portal_ipt_v2.py"
      - "scripts/refrescar_seguimiento_publico.py"
      - "scripts/refrescar_seguimiento_publico_v2.py"
      - "scripts/validar_frescura_normativa.py"

permissions:
  contents: write

concurrency:
  group: actualizar-ipt-diaria
  cancel-in-progress: false

jobs:
  actualizar:
    name: Revisar IPT, actos y vigencia de Chile
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: automation/requirements.txt

      - name: Instalar dependencias
        run: |
          pip install -r automation/requirements.txt
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Sincronizar Portal IPT MINVU
        id: portal
        continue-on-error: true
        run: python scripts/sincronizar_portal_ipt_v2.py

      - name: Revisar Diario Oficial sin servicios locales ni API pagada
        id: multifuente
        continue-on-error: true
        run: python scripts/barrido_ipt_diario_oficial.py

      - name: Refrescar inventario normativo detallado nacional
        run: python scripts/refrescar_seguimiento_publico_v2.py

      - name: Exportar certificación normativa de tablas
        run: python scripts/exportar_vigencia_tablas.py

      - name: Actualizar vigencia cartográfica complementaria
        run: python automation/actualizar_vigencia_cartografica.py

      - name: Validar estructura del portal
        run: python automation/validar_sitio.py

      - name: Guardar cambios normativos disponibles
        id: publicar
        run: |
          if git diff --quiet; then
            echo "La revisión terminó sin cambios de archivos."
            exit 0
          fi

          git config user.name "Observatorio IPT Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data documentos consolidados
          git commit -m "Sincronización normativa nacional $(date +'%Y-%m-%d')"
          git pull --rebase origin main
          git push origin main

      - name: Comprobar frescura integral
        if: always() && steps.publicar.outcome == 'success'
        run: |
          python scripts/validar_frescura_normativa.py --max-age-days 8 --require-multifuente
          if [ "${{ steps.portal.outcome }}" != "success" ]; then
            echo "El Portal IPT no pudo sincronizarse en esta ejecución; se conservó su último snapshot y continuó el barrido del Diario Oficial."
            exit 1
          fi
          if [ "${{ steps.multifuente.outcome }}" != "success" ]; then
            echo "El barrido del Diario Oficial falló en esta ejecución."
            exit 1
          fi
