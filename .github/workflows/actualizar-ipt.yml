name: Actualizar IPT semanal

on:
  schedule:
    - cron: "0 7 * * 1"
      timezone: "America/Santiago"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-ipt-semanal
  cancel-in-progress: false

jobs:
  actualizar:
    name: Revisar IPT de Chile
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: automation/requirements.txt

      - name: Instalar dependencias
        run: pip install -r automation/requirements.txt

      - name: Revisar actualizaciones IPT
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5-mini' }}
        run: python automation/actualizar_ipt_mensual.py

      - name: Actualizar vigencia cartográfica
        run: python automation/actualizar_vigencia_cartografica.py

      - name: Validar portal
        run: python automation/validar_sitio.py

      - name: Guardar cambios
        run: |
          if git diff --quiet; then
            echo "No hay cambios nuevos."
            exit 0
          fi

          git config user.name "Observatorio IPT Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ipt_reportes.js data/vigencia_cartografica.js documentos/ipt/ documentos/vigencia/ consolidados/ipt/ consolidados/vigencia/
          git commit -m "Actualización IPT semanal $(date +'%Y-%m-%d')"
          git push
