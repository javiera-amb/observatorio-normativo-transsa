name: Refrescar cache TUI normativa

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refrescar-cache-tui.yml"
      - "data/seguimiento_normativo.js"
      - "data/vigencia_tablas_normativas.js"
      - "data/cola_tablas_normativas.js"
      - "data/tablas_normativas_sharepoint.js"
      - "data/tablas_normativas_chiguayante_ui.js"
      - "tui-content.js"
      - "vigencia-tablas-ui.js"
      - "tablas-normativas-fuentes.js"
      - "config/tablas_normativas_fuentes/**"
      - "config/tablas_normativas_vigencia/**"
      - "config/tablas_normativas_vigencia_policy.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refrescar-cache-tui-normativa
  cancel-in-progress: false

jobs:
  refrescar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Actualizar versiones y carga de fuentes comunales
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          release = f"20260902-{os.environ['RELEASE_SHA'][:12]}"

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          text = re.sub(
              r'data/seguimiento_normativo\.js\?v=[^"\']+',
              f'data/seguimiento_normativo.js?v={release}',
              text,
          )
          text = re.sub(
              r'ux-refresh\.js\?v=[^"\']+',
              f'ux-refresh.js?v={release}',
              text,
          )
          index.write_text(text, encoding='utf-8')

          ux = Path('ux-refresh.js')
          text = ux.read_text(encoding='utf-8')
          text = re.sub(
              r'tui-content\.js\?v=[^"\']+',
              f'tui-content.js?v={release}',
              text,
          )
          ux.write_text(text, encoding='utf-8')

          tui = Path('tui-content.js')
          text = tui.read_text(encoding='utf-8')
          text = re.sub(
              r'const release = "[^"]+";',
              f'const release = "{release}";',
              text,
              count=1,
          )
          anchor = '      await loadScript(`tablas-normativas-fuentes.js?v=${release}`, "tablas-normativas-fuentes");'
          communal = '      await loadScript(`data/tablas_normativas_chiguayante_ui.js?v=${release}`, "tablas-normativas-chiguayante-ui");'
          cert_data = '      await loadScript(`data/vigencia_tablas_normativas.js?v=${release}`, "vigencia-tablas-data");'
          queue_data = '      await loadScript(`data/cola_tablas_normativas.js?v=${release}`, "cola-tablas-data");'
          cert_ui = '      await loadScript(`vigencia-tablas-ui.js?v=${release}`, "vigencia-tablas-ui");'
          if communal not in text:
              if anchor not in text:
                  raise RuntimeError('No se encontró el ancla del módulo de fuentes normativas.')
              text = text.replace(anchor, communal + '\n' + anchor)
          if cert_data not in text:
              if anchor not in text:
                  raise RuntimeError('No se encontró el ancla para certificación normativa.')
              text = text.replace(anchor, anchor + '\n' + cert_data)
          if queue_data not in text:
              if cert_data not in text:
                  raise RuntimeError('No se encontró el ancla para la cola nacional.')
              text = text.replace(cert_data, cert_data + '\n' + queue_data)
          if cert_ui not in text:
              if queue_data not in text:
                  raise RuntimeError('No se encontró el ancla para la interfaz de vigencia.')
              text = text.replace(queue_data, queue_data + '\n' + cert_ui)
          tui.write_text(text, encoding='utf-8')

          print('Release TUI:', release)
          PY

      - name: Validar cobertura nacional y referencias críticas
        run: |
          grep -q "data/seguimiento_normativo.js?v=20260902-" index.html
          grep -q "ux-refresh.js?v=20260902-" index.html
          grep -q "tui-content.js?v=20260902-" ux-refresh.js
          grep -q "tablas_normativas_chiguayante_ui.js" tui-content.js
          grep -q "vigencia_tablas_normativas.js" tui-content.js
          grep -q "cola_tablas_normativas.js" tui-content.js
          grep -q "vigencia-tablas-ui.js" tui-content.js
          test -f data/cola_tablas_normativas.js
          node --check vigencia-tablas-ui.js
          node - <<'NODE'
          const fs = require('fs');
          const path = 'data/cola_tablas_normativas.js';
          const raw = fs.readFileSync(path, 'utf8').trim();
          const prefix = 'window.COLA_TABLAS_NORMATIVAS = ';
          if (!raw.startsWith(prefix) || !raw.endsWith(';')) {
            throw new Error('Formato inválido de la cola nacional.');
          }
          const queue = JSON.parse(raw.slice(prefix.length, -1));
          const rows = Array.isArray(queue.comunas) ? queue.comunas : [];
          const exclusions = Array.isArray(queue.instrumentos_excluidos_completitud)
            ? queue.instrumentos_excluidos_completitud : [];
          const names = rows.map(row => String(row.comuna || '').trim()).filter(Boolean);
          const unique = new Set(names);
          const incomplete = rows.filter(row =>
            !String(row.comuna || '').trim() ||
            !String(row.region || '').trim() ||
            !String(row.accion_prioritaria || '').trim() ||
            !String(row.estado_vigencia || '').trim()
          );

          if (Number(queue.total_comunas) !== 346 || rows.length !== 346) {
            throw new Error(`Cobertura incompleta: ${rows.length}/346 comunas.`);
          }
          if (Number(queue.cobertura_plataforma) !== 346 || Number(queue.cobertura_plataforma_objetivo) !== 346) {
            throw new Error('La cobertura operativa de plataforma debe ser 346/346.');
          }
          if (unique.size !== 346) {
            throw new Error(`Hay comunas duplicadas o sin nombre: ${unique.size}/346 únicas.`);
          }
          if (incomplete.length) {
            throw new Error(`Hay ${incomplete.length} comuna(s) sin estado/acción nacional completa.`);
          }
          if (queue.alcance_completitud !== 'PRC_Y_NORMATIVA_COMUNAL') {
            throw new Error('El alcance de completitud no corresponde a PRC + normativa comunal.');
          }
          if (!exclusions.includes('PRI') || !exclusions.includes('PRM')) {
            throw new Error('PRI/PRM deben quedar explícitamente fuera del indicador de completitud.');
          }
          console.log(`QA nacional OK: ${rows.length}/346 comunas · certificadas=${Number(queue.certificadas || 0)} · PRI/PRM excluidos.`);
          NODE

      - name: Publicar cache-bust
        run: |
          if git diff --quiet -- index.html ux-refresh.js tui-content.js; then
            echo "Las referencias ya estaban actualizadas."
            exit 0
          fi
          git config user.name "Observatorio IPT Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html ux-refresh.js tui-content.js
          git commit -m "Refrescar cache TUI normativa"
          git pull --rebase origin main
          git push
