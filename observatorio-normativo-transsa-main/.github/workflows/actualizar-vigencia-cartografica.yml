name: Actualizar vigencia cartográfica

on:
  schedule:
    - cron: "30 8 2 * *"
      timezone: "America/Santiago"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-vigencia-cartografica
  cancel-in-progress: false

jobs:
  actualizar:
    name: Cruzar IPT y cartografía
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: automation/requirements.txt

      - name: Instalar dependencias
        run: pip install -r automation/requirements.txt

      - name: Evaluar vigencia cartográfica
        run: python automation/actualizar_vigencia_cartografica.py

      - name: Validar portal
        run: python automation/validar_sitio.py

      - name: Guardar cambios
        run: |
          if git diff --quiet; then
            echo "No hay cambios nuevos."
            exit 0
          fi

          git config user.name "Observatorio Cartográfico Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/vigencia_cartografica.js documentos/vigencia/ consolidados/vigencia/
          git commit -m "Actualizar vigencia cartográfica $(date +'%Y-%m-%d')"
          git push
